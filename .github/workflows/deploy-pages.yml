name: Deploy CET vocabulary site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate vocabulary counts
        run: npm run validate:vocabulary
      - name: Prepare static site
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist/vendor
          cp index.html favicon.svg dist/
          cp -R src assets dist/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js dist/vendor/supabase.js
          node <<'NODE'
          import { writeFileSync } from 'node:fs';

          const config = {
            VITE_SUPABASE_URL: process.env.VITE_SUPABASE_URL || '',
            VITE_SUPABASE_ANON_KEY: process.env.VITE_SUPABASE_ANON_KEY || '',
          };

          writeFileSync('dist/runtime-config.js', `window.__SHICI_ENV__=${JSON.stringify(config)};\n`);
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
