    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('shici-cet-state-v3') || '{}');
          const preference = saved.settings?.themePreference;
          const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#1b201a' : '#f5f6f1');
        } catch { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
